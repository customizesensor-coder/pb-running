<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>PB 跑鞋部落</title>
  <style>
    /* ============== 莫兰迪色板 ============== */
    :root{
      --m-bg:        #EFEAE3;   /* 米卡奶 - 主背景 */
      --m-bg-2:      #E7E1D7;   /* 米灰 - 次级背景 */
      --m-card:      #F6F2EB;   /* 卡片米白 */
      --m-line:      #D8D1C5;   /* 卡片描边/分隔线 */
      --m-ink:       #4A4A48;   /* 主文字（柔黑） */
      --m-ink-2:     #7A7670;   /* 次级文字 */
      --m-muted:     #A8A29A;   /* 提示文字 */
      --m-sage:      #A8B5A2;   /* 雾霾豆绿 - 主题色 */
      --m-sage-d:    #8C9C87;   /* 深一点的豆绿 */
      --m-rose:      #C9A9A0;   /* 烟豆沙 */
      --m-blue:      #9FB0B8;   /* 烟青 */
      --m-sand:      #C8B7A0;   /* 焦糖沙 */
      --m-clay:      #B5A294;   /* 柔陶 */
      --m-shadow:    0 6px 20px rgba(74,74,72,.08);
      --m-shadow-sm: 0 2px 8px rgba(74,74,72,.06);
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;padding:0;background:var(--m-bg);color:var(--m-ink);
      font-family:-apple-system,"PingFang SC","Microsoft Yahei",sans-serif;
      letter-spacing:.2px;
      background-image:
        radial-gradient(at 8% 0%, rgba(168,181,162,.18) 0, transparent 45%),
        radial-gradient(at 92% 100%, rgba(201,169,160,.16) 0, transparent 50%);
      background-attachment: fixed;
    }

    .wrap{max-width:560px;margin:0 auto;padding:18px 18px 36px;}

    /* ============== 顶部品牌区 ============== */
    .brand{
      display:flex;align-items:center;gap:12px;
      padding:6px 4px 14px;
    }
    .logo{
      width:46px;height:46px;border-radius:14px;
      background:linear-gradient(135deg, var(--m-sage) 0%, var(--m-sage-d) 100%);
      display:flex;align-items:center;justify-content:center;
      color:#F6F2EB;font-weight:700;font-size:17px;letter-spacing:1px;
      box-shadow: var(--m-shadow);
    }
    .brand-text{display:flex;flex-direction:column;line-height:1.15}
    .brand-name{font-size:20px;font-weight:700;color:var(--m-ink)}
    .brand-sub{font-size:12px;color:var(--m-ink-2);margin-top:2px;letter-spacing:1px}

    /* ============== Hero 卡片 ============== */
    .hero{
      background:var(--m-card);
      border:1px solid var(--m-line);
      border-radius:22px;
      padding:18px 18px 16px;
      box-shadow:var(--m-shadow);
    }
    .hero-title{
      font-size:14px;color:var(--m-ink-2);margin-bottom:12px;
      display:flex;align-items:center;gap:6px;
    }
    .hero-title::before{
      content:"";width:14px;height:2px;background:var(--m-sage);border-radius:2px;
    }
    .preview{
      width:100%;aspect-ratio:4/3;
      background:
        linear-gradient(135deg, var(--m-bg-2) 0%, #DCD5C8 100%);
      border-radius:16px;
      display:flex;align-items:center;justify-content:center;
      color:var(--m-muted);font-size:13px;letter-spacing:1px;
      overflow:hidden;position:relative;
    }
    .preview::after{
      content:"";position:absolute;inset:0;border-radius:16px;
      box-shadow:inset 0 0 0 1px rgba(74,74,72,.04);
      pointer-events:none;
    }
    .preview img{width:100%;height:100%;object-fit:cover;display:block}
    .preview .placeholder{
      display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center
    }
    .preview .ico{
      width:42px;height:42px;border-radius:50%;
      background:rgba(255,255,255,.55);
      display:flex;align-items:center;justify-content:center;
      color:var(--m-sage-d);
    }

    .btns{display:flex;gap:10px;margin-top:14px}
    .btn{
      flex:1;padding:13px 0;border:0;border-radius:14px;
      font-size:15px;font-weight:600;cursor:pointer;
      transition: transform .12s ease, box-shadow .12s ease, background .2s ease;
      letter-spacing:.5px;
    }
    .btn.primary{
      background:var(--m-sage);color:#F6F2EB;
      box-shadow: 0 4px 12px rgba(140,156,135,.35);
    }
    .btn.primary:hover{background:var(--m-sage-d)}
    .btn.ghost{
      background:transparent;color:var(--m-ink);
      border:1.5px solid var(--m-line);
    }
    .btn.ghost:hover{background:var(--m-bg-2)}
    .btn:active{transform:scale(.98)}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
    input[type=file]{display:none}

    /* ============== 加载/错误 ============== */
    .progress{
      display:none;align-items:center;justify-content:center;gap:10px;
      margin-top:16px;color:var(--m-ink-2);font-size:13px;
      background:var(--m-card);border:1px solid var(--m-line);
      border-radius:12px;padding:11px 14px;
    }
    .progress.show{display:flex}
    .spinner{
      width:16px;height:16px;border-radius:50%;
      border:2px solid var(--m-line);border-top-color:var(--m-sage);
      animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    .err{
      background:#E8D5CE;color:#7A4A40;
      padding:11px 14px;border-radius:12px;margin-top:14px;
      font-size:13px;display:none;white-space:pre-wrap;
      border:1px solid #D8BFB6;
    }
    .err.show{display:block}

    /* ============== 结果区 ============== */
    .cards{display:none;margin-top:18px}
    .cards.show{display:block;animation:fadeIn .4s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

    .result-title{
      display:flex;align-items:center;justify-content:space-between;
      padding:0 4px 10px;
    }
    .result-title h3{
      margin:0;font-size:15px;color:var(--m-ink);font-weight:600;
      display:flex;align-items:center;gap:8px;
    }
    .result-title h3::before{
      content:"";width:6px;height:6px;border-radius:50%;background:var(--m-sage);
    }
    .badge{
      font-size:11px;color:var(--m-ink-2);
      background:var(--m-bg-2);padding:4px 10px;border-radius:99px;
      letter-spacing:.5px;
    }

    .card{
      background:var(--m-card);
      border:1px solid var(--m-line);
      border-radius:16px;padding:14px 16px;margin-bottom:10px;
      box-shadow:var(--m-shadow-sm);
      display:flex;gap:12px;align-items:flex-start;
    }
    .card .tag{
      flex:0 0 auto;width:46px;
      font-size:11px;color:#fff;font-weight:600;
      padding:4px 0;border-radius:8px;text-align:center;letter-spacing:1px;
    }
    .tag.t1{background:var(--m-sage)}
    .tag.t2{background:var(--m-blue)}
    .tag.t3{background:var(--m-rose)}
    .tag.t4{background:var(--m-clay)}
    .tag.t5{background:var(--m-sand)}

    .card-body{flex:1;min-width:0}
    .label{font-size:11px;color:var(--m-muted);letter-spacing:1px}
    .value{
      font-size:15px;margin-top:4px;line-height:1.6;
      color:var(--m-ink);word-break:break-word;
    }
    #vName{font-size:17px;font-weight:600}
    #vPrice{font-weight:600;color:var(--m-sage-d)}

    .footer{
      color:var(--m-muted);font-size:11px;text-align:center;
      margin-top:28px;line-height:1.7;letter-spacing:.5px;
    }
    .footer .dot{display:inline-block;margin:0 6px;color:var(--m-line)}
  </style>
</head>
<body>
  <div class="wrap">

    <!-- 品牌头部 -->
    <div class="brand">
      <div class="logo">PB</div>
      <div class="brand-text">
        <div class="brand-name">PB 跑鞋部落</div>
        <div class="brand-sub">PERSONAL BEST · RUNNING TRIBE</div>
      </div>
    </div>

    <!-- Hero 卡片 -->
    <div class="hero">
      <div class="hero-title">拍下你的跑鞋，让 AI 解读它</div>

      <div class="preview" id="preview">
        <div class="placeholder">
          <div class="ico">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
          </div>
          <div>点击下方按钮选择跑鞋图片</div>
        </div>
      </div>

      <div class="btns">
        <button class="btn primary" id="btnCamera">拍照识别</button>
        <button class="btn ghost" id="btnGallery">从相册</button>
      </div>

      <input type="file" id="fileCamera" accept="image/*" capture="environment" />
      <input type="file" id="fileGallery" accept="image/*" />

      <div class="progress" id="progress">
        <div class="spinner"></div>
        <span>识别中，请稍候 · 约 10–20 秒</span>
      </div>
      <div class="err" id="err"></div>
    </div>

    <!-- 结果区 -->
    <div class="cards" id="cards">
      <div class="result-title">
        <h3>识别结果</h3>
        <span class="badge">AI · qwen-vl-max</span>
      </div>

      <div class="card">
        <div class="tag t1">鞋款</div>
        <div class="card-body">
          <div class="label">SHOE</div>
          <div class="value" id="vName">-</div>
        </div>
      </div>

      <div class="card">
        <div class="tag t2">性能</div>
        <div class="card-body">
          <div class="label">PERFORMANCE</div>
          <div class="value" id="vPerformance">-</div>
        </div>
      </div>

      <div class="card">
        <div class="tag t3">特点</div>
        <div class="card-body">
          <div class="label">FEATURES</div>
          <div class="value" id="vFeatures">-</div>
        </div>
      </div>

      <div class="card">
        <div class="tag t4">脚型</div>
        <div class="card-body">
          <div class="label">FOOT TYPE</div>
          <div class="value" id="vFootType">-</div>
        </div>
      </div>

      <div class="card">
        <div class="tag t5">价格</div>
        <div class="card-body">
          <div class="label">PRICE RANGE</div>
          <div class="value" id="vPrice">-</div>
        </div>
      </div>
    </div>

    <div class="footer">
      PB 跑鞋部落 <span class="dot">·</span> 仅作演示 <span class="dot">·</span> 数据由 AI 实时生成，仅供参考
    </div>
  </div>

<script>
/* ============== 配置区：把你的 key 填到这里 ============== */
const DASHSCOPE_API_KEY = "sk-ws-H.REMYEMM.VHwG.MEYCIQCRXLczlvB1vkM6ZFCSLg4BKSWijwjQypvVYZPHWas6PAIhAOt34MsZRWa48zxa3wLfjc7xhfX69WfPfXZLX-sEZyvJ";
const DEEPSEEK_API_KEY  = "sk-f88306d0b4764bff8a91291edfafa363";
/* ====================================================== */

const $ = id => document.getElementById(id);
const PROMPT = `你是一名专业的跑鞋识别助手。请识别图中的跑鞋，并严格按下面 JSON 格式返回（只输出 JSON，不要任何额外文字、不要 markdown 代码块）：
{
  "name": "品牌+具体型号，例如 Nike Pegasus 40",
  "performance": "性能描述：缓震/支撑/响应/重量等关键参数",
  "features": "外观与技术亮点，简短1-2句",
  "footType": "适合的脚型，如 正常足/扁平足/高足弓/宽脚",
  "priceRange": "人民币价格区间，例如 ¥899-1299"
}
若图片不是跑鞋或无法识别，name 字段填 "无法识别"，其余字段填 "-"。`;

$("btnCamera").onclick  = () => $("fileCamera").click();
$("btnGallery").onclick = () => $("fileGallery").click();
$("fileCamera").onchange  = e => handleFile(e.target.files[0]);
$("fileGallery").onchange = e => handleFile(e.target.files[0]);

async function handleFile(file) {
  if (!file) return;
  showError("");
  showResultCards(false);
  const previewUrl = URL.createObjectURL(file);
  $("preview").innerHTML = `<img src="${previewUrl}" alt="预览">`;

  let dataUrl;
  try {
    dataUrl = await compressImage(file, 1024, 0.8);
  } catch (e) { return showError("图片读取失败：" + e.message); }

  setLoading(true);
  try {
    let result = await callQwenVL(dataUrl);
    if (DEEPSEEK_API_KEY && result.name && result.name !== "无法识别" && result.name !== "-") {
      try { result = await enrichWithDeepSeek(result); } catch (_) {}
    }
    showResult(result);
  } catch (e) {
    showError("识别失败：" + e.message);
  } finally {
    setLoading(false);
  }
}

function compressImage(file, maxSide, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("FileReader error"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("图片解码失败"));
      img.onload = () => {
        const ratio = Math.max(img.width, img.height) / maxSide;
        const w = ratio > 1 ? Math.round(img.width / ratio) : img.width;
        const h = ratio > 1 ? Math.round(img.height / ratio) : img.height;
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function callQwenVL(dataUrl) {
  if (!DASHSCOPE_API_KEY) throw new Error("未配置 DASHSCOPE_API_KEY");
  const body = {
    model: "qwen-vl-max",
    messages: [{
      role: "user",
      content: [
        { type: "image_url", image_url: { url: dataUrl } },
        { type: "text", text: PROMPT }
      ]
    }]
  };
  const resp = await fetch("https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions", {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + DASHSCOPE_API_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify(body)
  });
  if (!resp.ok) {
    const t = await resp.text().catch(()=>"" );
    throw new Error("HTTP " + resp.status + " " + t.slice(0,200));
  }
  const j = await resp.json();
  const text = j.choices?.[0]?.message?.content || "";
  const cleaned = extractJson(text);
  const obj = JSON.parse(cleaned);
  return {
    name:        obj.name        || "-",
    performance: obj.performance || "-",
    features:    obj.features    || "-",
    footType:    obj.footType    || "-",
    priceRange:  obj.priceRange  || "-",
  };
}

async function enrichWithDeepSeek(r) {
  const prompt =
`根据以下跑鞋信息，补全更详细、专业的"特点 + 适合场景"描述（中文，2-3 句、不超过 80 字，
不要重复原文，不要使用 markdown 或换行）。只输出补全后的文字本身：
鞋款: ${r.name}
原始性能: ${r.performance}
原始特点: ${r.features}
适合脚型: ${r.footType}`;
  const resp = await fetch("https://api.deepseek.com/chat/completions", {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + DEEPSEEK_API_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      model: "deepseek-chat",
      temperature: 0.4,
      messages: [{ role: "user", content: prompt }]
    })
  });
  if (!resp.ok) return r;
  const j = await resp.json();
  const text = (j.choices?.[0]?.message?.content || "").trim();
  return text ? { ...r, features: text } : r;
}

function extractJson(s) {
  const a = s.indexOf("{"); const b = s.lastIndexOf("}");
  return (a >= 0 && b > a) ? s.slice(a, b+1) : s;
}
function showResult(r) {
  $("vName").textContent = r.name;
  $("vPerformance").textContent = r.performance;
  $("vFeatures").textContent = r.features;
  $("vFootType").textContent = r.footType;
  $("vPrice").textContent = r.priceRange;
  showResultCards(true);
  setTimeout(()=>$("cards").scrollIntoView({behavior:"smooth", block:"start"}), 50);
}
function showResultCards(b) { $("cards").classList.toggle("show", b); }
function setLoading(b) {
  $("progress").classList.toggle("show", b);
  $("btnCamera").disabled = b;
  $("btnGallery").disabled = b;
}
function showError(msg) {
  if (!msg) return $("err").classList.remove("show");
  $("err").textContent = msg;
  $("err").classList.add("show");
}
</script>
</body>
</html>
